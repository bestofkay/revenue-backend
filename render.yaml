# Render Blueprint — API + MySQL + Redis + RabbitMQ
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: Dashboard → New → Blueprint → connect this repo → apply.
# After first deploy, open the API URL + /docs and /api/v1/health

services:
  # ── Redis (Render Key Value) ───────────────────────────────────────────────
  - type: keyvalue
    name: revenue-redis
    plan: free
    ipAllowList: [] # private network only
    maxmemoryPolicy: noeviction

  # ── MySQL 8 (private service + disk) ───────────────────────────────────────
  - type: pserv
    name: revenue-mysql
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/docker/Dockerfile.mysql
    dockerContext: .
    disk:
      name: revenue-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: revenue
      - key: MYSQL_USER
        value: revenue
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  # ── RabbitMQ (private service + disk) ──────────────────────────────────────
  - type: pserv
    name: revenue-rabbitmq
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/docker/Dockerfile.rabbitmq
    dockerContext: .
    disk:
      name: revenue-rabbitmq-data
      mountPath: /var/lib/rabbitmq
      sizeGB: 5
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: revenue
      - key: RABBITMQ_DEFAULT_PASS
        generateValue: true

  # ── NestJS API (public web service) ────────────────────────────────────────
  - type: web
    name: revenue-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: API_URL
        value: auto
      - key: DATABASE_URL
        value: auto
      - key: RABBITMQ_URL
        value: auto
      - key: TENANT_AGENCY_CODE
        value: NCS
      - key: COOKIE_SECURE
        value: "true"
      - key: DEFAULT_CURRENCY
        value: NGN
      - key: SMS_PROVIDER
        value: console
      - key: WHATSAPP_PROVIDER
        value: console

      # Wired from sibling services
      - key: REDIS_URL
        fromService:
          name: revenue-redis
          type: keyvalue
          property: connectionString
      - key: MYSQL_HOST
        fromService:
          name: revenue-mysql
          type: pserv
          property: host
      - key: MYSQL_USER
        value: revenue
      - key: MYSQL_DATABASE
        value: revenue
      - key: MYSQL_PASSWORD
        fromService:
          name: revenue-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: RABBITMQ_HOST
        fromService:
          name: revenue-rabbitmq
          type: pserv
          property: host
      - key: RABBITMQ_USER
        value: revenue
      - key: RABBITMQ_PASS
        fromService:
          name: revenue-rabbitmq
          type: pserv
          envVarKey: RABBITMQ_DEFAULT_PASS

      # Secrets (auto-generated where length is enough)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: HMAC_PAYMENT_SECRET
        generateValue: true

      # Prompted in the Render Dashboard on first Blueprint apply
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: PAY_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
