# Railway Config as Code — RabbitMQ
# In Railway: Settings → Config-as-code path → /infra/railway/rabbitmq/railway.toml
# Keep Root Directory at repo root (/).
# Set RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS as service variables.
# Do not enable a public HTTP domain unless you need the management UI.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/Dockerfile.rabbitmq"
watchPatterns = [
  "infra/docker/Dockerfile.rabbitmq"
]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
