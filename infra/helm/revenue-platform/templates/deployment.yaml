apiVersion: apps/v1
kind: Deployment
metadata:
  name: revenue-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: revenue-api
  template:
    metadata:
      labels:
        app: revenue-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: revenue-api-secrets
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: revenue-api
spec:
  type: {{ .Values.service.type }}
  selector:
    app: revenue-api
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 4000
