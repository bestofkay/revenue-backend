replicaCount: 2
image:
  repository: revenue/api
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 4000
env:
  API_PREFIX: api/v1
ingress:
  enabled: true
  host: api.revenue.gov.ng
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
