# Railway Config as Code — API service
# In Railway: Settings → Config-as-code path → /apps/api/railway.toml
# Keep service Root Directory at repo root (/) so monorepo packages resolve.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/Dockerfile.api"
watchPatterns = [
  "apps/api/**",
  "packages/**",
  "infra/docker/Dockerfile.api",
  "infra/docker/api-entrypoint.sh",
  "pnpm-lock.yaml",
  "package.json"
]

[deploy]
startCommand = "/app/infra/docker/api-entrypoint.sh"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
