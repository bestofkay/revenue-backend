env:
  contexts:
    - name: revenue-api
      urls:
        - http://localhost:4000
      includePaths:
        - http://localhost:4000/api/v1/health
        - http://localhost:4000/docs
jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
  - type: spider
    parameters:
      context: revenue-api
      maxDuration: 5
  - type: passiveScan-wait
    parameters:
      maxDuration: 10
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: revenue-baseline-report.html
