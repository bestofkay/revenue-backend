name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: revenue
          MYSQL_DATABASE: revenue
          MYSQL_USER: revenue
          MYSQL_PASSWORD: revenue
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -urevenue -prevenue"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: mysql://revenue:revenue@127.0.0.1:3306/revenue
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://revenue:revenue@localhost:5672
      APP_URL: http://localhost:3000
      PAY_URL: http://localhost:3001
      API_URL: http://localhost:4000
      API_PREFIX: api/v1
      TENANT_AGENCY_CODE: NCS
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters!!
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters!
      HMAC_PAYMENT_SECRET: ci-hmac-payment-secret-32chars!!!!
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @revenue/shared build
      - run: pnpm --filter @revenue/config build
      - run: pnpm --filter @revenue/database generate
      - run: pnpm --filter @revenue/database exec prisma migrate deploy
      - run: pnpm --filter @revenue/database build
      - run: pnpm --filter @revenue/shared test
      - run: pnpm --filter @revenue/api build
      - run: pnpm --filter @revenue/api test
      - run: pnpm --filter @revenue/web build
      - run: pnpm --filter @revenue/pay build
